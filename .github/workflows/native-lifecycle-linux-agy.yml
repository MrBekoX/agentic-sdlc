name: Native lifecycle (Google Antigravity on Linux)

# Manual only. The official agy installer (https://antigravity.google/cli/install.sh) has no version
# pin option and the CLI self-updates in the background during regular runs (install.sh and
# docs/getting-started.md, read 2026-11-21), so this job is not reproducible and is a supply-chain
# risk: it is kept out of the required ci.yml and prints `agy --version` for the record. It builds
# the agy package, runs `agy plugin validate --json` (no error, no warning outside the allow-list),
# and drives scripts/check_native_lifecycle.py --platform antigravity in an isolated HOME. No login,
# no secret and no model prompt is used. The result line feeds the Antigravity row of
# docs/publication/compatibility-matrix.md.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agy-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Same pins as ci.yml; Dependabot keeps the SHA and the version comment current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install the Antigravity CLI (unpinned official installer)
        shell: bash
        run: |
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Record the agy version
        shell: bash
        run: agy --version
      - name: Build and verify the Antigravity package
        shell: bash
        run: |
          python3 scripts/build_release.py --output "$RUNNER_TEMP/agy.zip" --antigravity
          python3 scripts/build_release.py --verify "$RUNNER_TEMP/agy.zip"
          python3 -m zipfile -e "$RUNNER_TEMP/agy.zip" "$RUNNER_TEMP/package"
      - name: Validate the package with agy
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/validate-home"
          HOME="$RUNNER_TEMP/validate-home" agy plugin validate --json "$RUNNER_TEMP/package" \
            > "$RUNNER_TEMP/validate.json" || true
          python3 - "$RUNNER_TEMP/validate.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1], encoding="utf-8"))
          # Known limitation: agy loads only the first 24000 bytes of a SKILL.md body.
          allowed = {("skills/agentic-sdlc-pipeline/SKILL.md", "only the first 24000 are loaded")}
          problems = [f for f in report.get("findings", [])
                      if f.get("severity") == "error" or (f.get("severity") == "warning" and not any(
                          f.get("file") == path and text in f.get("message", "") for path, text in allowed))]
          components = report.get("components", {})
          print("validate_components=" + json.dumps(components, sort_keys=True))
          for finding in problems:
              print("validate_problem=" + json.dumps(finding, sort_keys=True))
          expected = {"skills": 16, "agents": 11, "hooks": 1}
          if problems or report.get("manifest") != ".antigravity-plugin/plugin.json" or any(
                  components.get(key) != value for key, value in expected.items()):
              sys.exit(1)
          PY
      - name: Native install, reinstall and uninstall
        shell: bash
        run: python3 scripts/check_native_lifecycle.py --package "$RUNNER_TEMP/package" --platform antigravity --require antigravity
