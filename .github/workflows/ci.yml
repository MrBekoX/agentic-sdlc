name: CI

# Validation-only. This workflow must not publish a Claude plugin, create a
# release, push commits, or write to the repository.
on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run repo gate
        run: python scripts/check_all.py
      - name: Run skill harness
        run: python tests/skills/harness.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
