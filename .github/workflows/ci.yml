name: CI

# Runs on every pull request and on pushes to main; a push to another branch gets CI once a pull
# request exists for it. `workflow_dispatch` keeps a manual run available.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A pull request pushed twice cancels its own superseded run; main keeps every run, because each
# merge commit's result is the record that the branch was green at that commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  deterministic-gate:
    strategy:
      fail-fast: false
      matrix:
        # Keep macOS coverage when hosted ARM capacity leaves jobs unacquired.
        os: [ubuntu-latest, windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    # Three suite passes per OS: source, extracted archive, then source again for archive coverage.
    # An observed Intel macOS source pass took about 27 minutes; allow three passes plus setup.
    # Keep a finite budget instead of the GitHub default of 360 minutes.
    timeout-minutes: 90
    steps:
      # Actions are pinned to a full commit SHA: a tag can be moved, a SHA cannot. Dependabot keeps
      # both the SHA and the trailing version comment current (.github/dependabot.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The gate only reads the tree; leaving the token in .git/config would hand it to every
          # command the gate runs, including the suite's own git invocations.
          persist-credentials: false
          # Full history. The default depth-1 clone has no historical blobs, so
          # tests/test_release_ledger_docs.py SKIPPED its byte-exact ledger pin on every CI job -
          # a check that ran only on a maintainer's local clone. The archive job below keeps its
          # deliberate --depth=1 fetch; this is the source job only.
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Version consistency
        run: python3 scripts/bump_version.py --release-check
      - name: Manifest coverage
        run: python3 scripts/bump_version.py --audit
      - name: Static checks
        run: python3 scripts/check_all.py
      - name: Skill harness
        run: python3 tests/skills/harness.py
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Archive build
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/archive" "$RUNNER_TEMP/archive-logs"
          python3 scripts/build_release.py --output "$RUNNER_TEMP/archive/agentic-sdlc.zip" 2>&1 | tee "$RUNNER_TEMP/archive-logs/archive-build.log"
      - name: Archive verify
        shell: bash
        run: python3 scripts/build_release.py --verify "$RUNNER_TEMP/archive/agentic-sdlc.zip" 2>&1 | tee "$RUNNER_TEMP/archive-logs/archive-verify.log"
      - name: Archive extract to clean directory
        shell: bash
        run: |
          X="$RUNNER_TEMP/archive-extract/agentic-sdlc"
          python3 -m zipfile -e "$RUNNER_TEMP/archive/agentic-sdlc.zip" "$X"
          S=$(git rev-parse HEAD)
          git init -q "$X"
          git -C "$X" fetch -q --no-tags --depth=1 --no-write-fetch-head "$GITHUB_WORKSPACE" "$S"
          git -C "$X" update-ref HEAD "$S"
          git -C "$X" read-tree HEAD
          git -C "$X" update-index -q --refresh
      - name: "Archive gate: version check"
        shell: bash
        working-directory: ${{ runner.temp }}/archive-extract/agentic-sdlc
        run: python3 scripts/bump_version.py --check 2>&1 | tee "$RUNNER_TEMP/archive-logs/archive-gate-version-check.log"
      - name: "Archive gate: release check"
        shell: bash
        working-directory: ${{ runner.temp }}/archive-extract/agentic-sdlc
        run: python3 scripts/bump_version.py --release-check 2>&1 | tee "$RUNNER_TEMP/archive-logs/archive-gate-release-check.log"
      - name: "Archive gate: static checks"
        shell: bash
        working-directory: ${{ runner.temp }}/archive-extract/agentic-sdlc
        run: python3 scripts/check_all.py 2>&1 | tee "$RUNNER_TEMP/archive-logs/archive-gate-static-checks.log"
      - name: "Archive gate: skill harness"
        shell: bash
        working-directory: ${{ runner.temp }}/archive-extract/agentic-sdlc
        run: python3 tests/skills/harness.py 2>&1 | tee "$RUNNER_TEMP/archive-logs/archive-gate-skill-harness.log"
      - name: "Archive gate: unit tests"
        shell: bash
        working-directory: ${{ runner.temp }}/archive-extract/agentic-sdlc
        run: python3 -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/archive-logs/archive-gate-unit-tests.log"
      - name: "Archive gate: coverage comparison"
        shell: bash
        run: python3 -c "import sys; sys.path.insert(0, 'scripts'); import build_release; sys.exit(build_release.check_archive_gate_log(sys.argv[1], '.'))" "$RUNNER_TEMP/archive-logs/archive-gate-unit-tests.log"

  # A matrix reports one check per combination, so requiring the gate directly would mean requiring
  # every generated name and re-listing them whenever the matrix changes. This job is the single
  # stable name to require. `if: always()` makes it run even when a needed job fails; without the
  # explicit result test it would then report success.
  # The manifest checks Anthropic's own review pipeline runs on a submission. Verified to need no
  # credentials: with an empty HOME, an empty config directory and no API key, both calls exit 0.
  # The CLI is pinned so a new release cannot turn an unrelated day's run red; bumping the pin is
  # a reviewable change, like any other dependency.
  plugin-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install the pinned Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.293
      - name: Validate the marketplace and plugin manifests
        shell: bash
        run: |
          # On 2.1.289+ `validate .` checks the marketplace manifest and the plugin beside it; the
          # plugin manifest stays a named target too. --strict fails on warnings the runtime tolerates.
          rc=0
          claude plugin validate . --strict --json > marketplace-validation.json || rc=1
          claude plugin validate .claude-plugin/plugin.json --strict --json > plugin-validation.json || rc=1
          python3 -c "import json,sys; [print('%s success=%s strict=%s' % (f, json.load(open(f))['success'], json.load(open(f))['strict'])) for f in sys.argv[1:]]" marketplace-validation.json plugin-validation.json
          exit $rc

  ci-ok:
    if: always()
    needs: [deterministic-gate, plugin-validate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every gate job to have succeeded
        env:
          GATE_RESULT: ${{ needs.deterministic-gate.result }}
          VALIDATE_RESULT: ${{ needs.plugin-validate.result }}
        run: |
          echo "deterministic-gate=$GATE_RESULT plugin-validate=$VALIDATE_RESULT"
          test "$GATE_RESULT" = "success"
          test "$VALIDATE_RESULT" = "success"
